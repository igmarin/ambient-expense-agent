[project]
name = "ambient-expense-agent"
version = "0.1.0"
description = "Based on the 5 days intensive Google Agents course (days 1-5)"
authors = [
    {name = "Ismael Marin", email = "ismael.marin@gmail.com"},
]

dependencies = [
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "gcsfs>=2024.11.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0",
    "protobuf>=6.31.1,<7.0.0",
]
requires-python = ">=3.12,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "ruff>=0.4.6,<1.0.0",
    "pylint>=3.0.0,<4.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "pylint>=3.0.0,<4.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["expense_agent"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["expense_agent"]


# ---------------------------------------------------------------------------
# Pylint
# ---------------------------------------------------------------------------
[tool.pylint.main]
# Run across our source + tests; skip generated / virtual env files.
py-version = "3.12"
recursive = true
ignore-paths = ["\\.venv", "deployment", "__pycache__"]
jobs = 0  # auto-detect CPU count for parallel linting

[tool.pylint.messages_control]
# Keep signal-to-noise high. Disable stylistic checks already covered
# by ruff (line length, naming conventions handled per-project below).
disable = [
    "C0114",  # missing-module-docstring  (ruff handles this if needed)
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods   (common with Pydantic models)
    "W0511",  # fixme / todo             (noise in development)
]

[tool.pylint.format]
max-line-length = 88  # match ruff / black

[tool.pylint.design]
max-args = 8          # generous limit for node functions that take ctx + inputs
max-locals = 20

[tool.pylint.typecheck]
# ADK decorators wrap functions in a way pylint cannot always introspect.
ignored-modules = ["google.adk", "google.genai"]
ignored-classes = ["google.adk.workflow.Workflow", "google.adk.agents.LlmAgent"]

[tool.pylint."tests.*"]
# pytest injects fixtures as function arguments — not a real name clash.
disable = ["redefined-outer-name"]
